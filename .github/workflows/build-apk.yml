name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PADAutoSolver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-preview:
    if: github.event_name != 'pull_request' && github.repository == 'iwa45645/PADAutoSolver'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pad-release.jks"
      - name: Build signed preview and lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pad-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease :app:lintRelease
      - name: Verify package and fixed certificate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert m['applicationId'] == 'com.example.padautosolver'
          assert m['elements'][0]['versionCode'] >= 11
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 8f0319a7674ac4c94cae72f7f53c887d7d909fc997e0852f674fad41a3994ffc' "$RUNNER_TEMP/certificate.txt"
          cp app/build/outputs/apk/release/app-release.apk PADAutoSolver-preview-release.apk
          sha256sum PADAutoSolver-preview-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PADAutoSolver-signed-preview
          path: |
            PADAutoSolver-preview-release.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pad-release.jks"
