name: Release signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match app version)'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pad-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pad-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify version, package and fixed certificate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          m = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          e = m['elements'][0]
          assert m['applicationId'] == 'com.example.padautosolver'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['RELEASE_TAG'])
          assert os.environ['RELEASE_TAG'] == 'v' + e['versionName'], 'Tag/version mismatch'
          assert e['versionCode'] >= 2
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 8f0319a7674ac4c94cae72f7f53c887d7d909fc997e0852f674fad41a3994ffc' "$RUNNER_TEMP/certificate.txt"
          cp app/build/outputs/apk/release/app-release.apk PADAutoSolver-release.apk
          sha256sum PADAutoSolver-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PADAutoSolver-release
          path: |
            PADAutoSolver-release.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: PADAutoSolver ${{ env.RELEASE_TAG }}
          files: |
            PADAutoSolver-release.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pad-release.jks"
